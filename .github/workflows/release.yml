name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        run: echo "$SONORA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sonora.jks"
        env:
          SONORA_KEYSTORE_BASE64: ${{ secrets.SONORA_KEYSTORE_BASE64 }}
      - run: ./gradlew :app:assembleRelease --console=plain
        env:
          SONORA_KEYSTORE: ${{ runner.temp }}/sonora.jks
          SONORA_KEYSTORE_PASSWORD: ${{ secrets.SONORA_KEYSTORE_PASSWORD }}
          SONORA_KEY_ALIAS: ${{ secrets.SONORA_KEY_ALIAS }}
          SONORA_KEY_PASSWORD: ${{ secrets.SONORA_KEY_PASSWORD }}
      - name: Publish release
        run: |
          cp app/build/outputs/apk/release/app-release.apk "sonora-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "sonora-$GITHUB_REF_NAME.apk" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
