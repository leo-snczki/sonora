name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # JVM unit tests (core, Robolectric UI tests) and lint. The GL smoke test needs an emulator and runs locally.
      - run: ./gradlew check --console=plain
